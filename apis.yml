aid: aihunters
name: AIHunters
description: >-
  AIHunters was an AI and computer-vision company that built Cognitive Mill, a cognitive computing
  cloud platform for Media and Entertainment automation. Cognitive Mill analyzed long-form video with
  human-like scene understanding and shipped as branded services: CognitiveReelz (automated sports
  highlights and movie summarization), CognitiveSkip (end-credits detection for EPG correction),
  CognitiveCrop (cropping to portrait/mobile aspect), CognitiveCast (celebrity face-recognition
  metadata), CognitiveNude (nudity filtering) and CognitiveShapes (broadcast graphics detection). It
  exposed a public REST API at api.cognitivemill.com behind a Swagger UI. The company later became
  GrayPaw and pivoted to industrial cognitive vision; in February 2026 Linque acquired the Cognitive
  Vision AI IP. Both aihunters.com and cognitivemill.com now redirect to linque.com and the Cognitive
  Mill API host no longer resolves.
